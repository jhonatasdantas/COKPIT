name: Sync Shopee → cockpit_dev

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rodar sync Shopee
        run: npx --yes tsx scripts/shopee-sync.ts
        env:
          SUPABASE_PROJECT_REF: rzlmwspxzlcpfvgnixez
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SHOPEE_ERP_PARTNER_ID: ${{ secrets.SHOPEE_ERP_PARTNER_ID }}
          SHOPEE_ERP_PARTNER_KEY: ${{ secrets.SHOPEE_ERP_PARTNER_KEY }}
          SHOPEE_HOST: https://partner.shopeemobile.com
